<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RedTec - Equipos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div id="loginBox" class="container py-5">
    <h1 class="text-center mb-4">📦 RedTec</h1>
    <div class="card mx-auto p-4 shadow-sm" style="max-width: 400px;">
      <h4 class="mb-3">Iniciar sesión</h4>
      <input id="email" type="email" class="form-control mb-2" placeholder="Email" value="usuario@redtec.com">
      <input id="password" type="password" class="form-control mb-3" placeholder="Contraseña">
      <button id="btnLogin" class="btn btn-primary w-100">Entrar</button>
      <div id="error" class="text-danger mt-2"></div>
    </div>
  </div>

  <div id="appBox" class="d-none">
    <nav class="navbar navbar-dark bg-dark px-3 mb-4">
      <span class="navbar-brand">📦 RedTec</span>
      <div class="d-flex align-items-center gap-2">
        <span id="saludo" class="text-white small"></span>
        <button id="btnPassword" class="btn btn-outline-light btn-sm">Cambiar contraseña</button>
        <button id="btnLogout" class="btn btn-light btn-sm">Salir</button>
      </div>
    </nav>

    <div class="container pb-5">
      <div id="avisos"></div>

      <div id="passwordBox" class="card p-3 mb-4 d-none">
        <h5>Cambiar contraseña</h5>
        <input id="passActual" type="password" class="form-control mb-2" placeholder="Contraseña actual">
        <input id="passNueva" type="password" class="form-control mb-2" placeholder="Nueva contraseña (mínimo 8 caracteres)">
        <button id="btnGuardarPass" class="btn btn-success">Guardar</button>
      </div>

      <h4 class="mb-3">Equipos disponibles</h4>
      <div id="lista" class="row g-3 mb-5"></div>

      <h4 id="tituloPrestamos" class="mb-3">Mis préstamos</h4>
      <ul id="prestamos" class="list-group mb-5"></ul>

      <div id="adminBox" class="card p-3 d-none">
        <h5>Agregar equipo (solo administrador)</h5>
        <input id="nuevoNombre" class="form-control mb-2" placeholder="Nombre">
        <select id="nuevaCategoria" class="form-select mb-2">
          <option value="audiovisual">audiovisual</option>
          <option value="herramienta">herramienta</option>
          <option value="laptop">laptop</option>
        </select>
        <input id="nuevaDescripcion" class="form-control mb-2" placeholder="Descripción">
        <input id="nuevaFoto" class="form-control mb-2" placeholder="Foto: https://... o /img/camara.jpg (opcional)">
        <button id="btnAgregar" class="btn btn-primary">Agregar equipo</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
