<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RedTec - Equipos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="text-center mb-4">RedTec - Centro de recursos</h1>

    <div id="loginBox" class="card mx-auto p-4" style="max-width: 400px;">
      <h4 class="mb-3">Iniciar sesión</h4>
      <input id="email" type="email" class="form-control mb-2" placeholder="Email" value="usuario@redtec.com">
      <input id="password" type="password" class="form-control mb-3" placeholder="Contraseña">
      <button id="btnLogin" class="btn btn-primary w-100">Entrar</button>
      <div id="error" class="text-danger mt-2"></div>
    </div>

    <div id="appBox" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <span id="saludo" class="fw-bold"></span>
        <button id="btnLogout" class="btn btn-outline-secondary btn-sm">Cerrar sesión</button>
      </div>
      <h4>Equipos disponibles</h4>
      <div id="lista" class="row g-3"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
